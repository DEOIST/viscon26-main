# The VM's direct address with HTTPS, so the camera WebSocket works (see deploy/Caddyfile):
#   docker compose -f compose.yaml -f compose.direct.yaml up -d --build
# Then open https://18-direct.viscon-hackathon.ch (or SITE_ADDRESS).
services:
  caddy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-18-direct.viscon-hackathon.ch}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep them, Let's Encrypt rate-limits reissuing
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
