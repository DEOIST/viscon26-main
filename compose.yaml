# docker compose up --build, then open http://localhost:8080 (or https://localhost via Caddy).
# On the VIScon VM, set SITE_ADDRESS=18-direct.viscon-hackathon.ch in .env next to this file.
# Source is copied into images; no bind mount can hide installed dependencies.
services:
  db:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eth_simulator}
      POSTGRES_USER: ${POSTGRES_USER:-eth_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: public.ecr.aws/docker/library/redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - path: backend/.env
        required: false
    environment:
      ENVIRONMENT: development
      REDIS_URL: redis://redis:6379/0
      # Ignore a local .env URL containing a host-only address.
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-eth_simulator}
      POSTGRES_USER: ${POSTGRES_USER:-eth_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173},http://localhost:${BACKEND_PORT:-8000},http://127.0.0.1:${BACKEND_PORT:-8000}}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "8080:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  caddy:
    # HTTPS in front of the frontend (deploy/Caddyfile). The hackathon's managed proxy doesn't
    # support WebSockets, which the camera stream needs, so the VM serves itself on its direct
    # address. Locally SITE_ADDRESS defaults to localhost with Caddy's own self-signed certificate.
    image: public.ecr.aws/docker/library/caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp" # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep them, Let's Encrypt rate-limits reissuing
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  redis-data:
  caddy_data:
  caddy_config:
