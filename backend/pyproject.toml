# Tool configuration only; dependencies live in requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, pep8-naming
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.pep8-naming]
# `ItemWHid` ("without id") is our naming convention for create payloads.
ignore-names = ["*WHid"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "level1/tests", "level2/tests"]
# No test may reach the network (OpenAI credits, real Redis). Unix sockets stay allowed because
# the event loop under TestClient uses a socketpair.
addopts = "--disable-socket --allow-unix-socket"
