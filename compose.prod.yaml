# Server-side stack used by .github/workflows/cd.yml: runs the image CD published to GHCR
# instead of building locally. The deploy job copies this file to ~/app/ on the server.
#
#   IMAGE=ghcr.io/<owner>/<repo> TAG=<sha> docker compose -f compose.prod.yaml up -d
#
# For local production runs use compose.yaml (`make prod`), which builds from source.

services:
  app:
    image: ${IMAGE:?set IMAGE to ghcr.io/<owner>/<repo>}:${TAG:-latest}
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      # Production settings on the server, next to this file (see backend/.env.example).
      - path: .env
        required: false
    environment:
      ENVIRONMENT: production
    restart: unless-stopped
